name: ${DEPLOY_PROJECT_NAME:-to-toan}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      NEST_HOST: 0.0.0.0
      NEST_PORT: 3001
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
      LATEX_STORAGE_DIR: /data/latex-builds
    volumes:
      - latex_builds:/data/latex-builds
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
    restart: unless-stopped
    logging: *default-logging
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      NEST_API_URL: http://api:3001
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    logging: *default-logging
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
      LATEX_STORAGE_DIR: /data/latex-builds
      LATEX_WORK_DIR: /work
      LATEX_EXECUTION_MODE: shared
    volumes:
      - latex_builds:/data/latex-builds
      - latex_work:/work
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "apps/api/scripts/check-worker-health.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  compiler:
    image: texlive/texlive:latest
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/opt/compile-loop.sh"]
    user: "1000:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    environment:
      HOME: /tmp
      TEXMFVAR: /tmp/texmf-var
      openin_any: p
      openout_any: p
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - latex_work:/work
      - ./docker/compile-loop.sh:/opt/compile-loop.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
    networks: [internal]

  migrate:
    profiles: [ops]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    logging: *default-logging
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["node", "node_modules/typeorm/cli.js", "-d", "apps/api/dist/database/data-source.js", "migration:run"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [internal]

networks:
  internal:

volumes:
  mysql_data:
  redis_data:
  latex_builds:
  latex_work:
  caddy_data:
  caddy_config:
